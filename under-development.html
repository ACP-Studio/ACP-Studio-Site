<!doctype html>
<html lang="en" data-access="public" data-page="under-development">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071b18" />
    <script src="boot.js"></script>
    <link rel="icon" type="image/png" href="Assests/logo.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="under-development.css" />
    <title>Under development · ACP-Studio</title>
  </head>
  <body class="login-page dev-page">
    <!-- Decorative glass orbs (the card blurs them) -->
    <div class="login-orbs" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <main>
      <section class="login-card dev-card">
        <div class="intro-tag">ACP-Studio</div>
        <h1>Under development</h1>
        <p class="login-lead">
          The site is still being built. It will be available on
          <time datetime="2026-11-19T00:00:00+04:00"><strong>19 November 2026 at 16:00</strong></time>
          UAE time (GMT+4).
        </p>

        <div class="countdown" role="timer" aria-label="Time left until the site opens">
          <div class="count-unit">
            <span class="count-num" id="cdDays">--</span>
            <span class="count-label">days</span>
          </div>
          <div class="count-unit">
            <span class="count-num" id="cdHours">--</span>
            <span class="count-label">hours</span>
          </div>
          <div class="count-unit">
            <span class="count-num" id="cdMinutes">--</span>
            <span class="count-label">minutes</span>
          </div>
          <div class="count-unit">
            <span class="count-num" id="cdSeconds">--</span>
            <span class="count-label">seconds</span>
          </div>
        </div>

        <p class="dev-local" id="devLocal" hidden></p>

        <p class="login-legal">
          <a href="privacy.html">Privacy Policy</a> ·
          <a href="terms.html">Terms &amp; Conditions</a> ·
          <a href="cookies.html">Cookies</a>
        </p>
      </section>
    </main>

    <script src="under-development.js"></script>
  </body>
</html>
