<!doctype html>
<html lang="en" data-access="public">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://ppvncqbwfkubqmuehsfl.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ACP-Studio is under development. Something special is going on." />
    <meta name="theme-color" content="#e3c6a6" />
    <script src="boot.js"></script>
    <link rel="preload" href="fonts/cascadia-code-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/png" href="Assests/logo.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="under-development.css" />
    <title>Under Development · ACP-Studio</title>
  </head>
  <body class="soon-page dev-page">
    <!-- Dynamic Island Navigation -->
    <nav class="dynamic-island" id="dynamicIsland" aria-label="Main menu" tabindex="0">
      <div class="island-status">
        <span class="island-section"><span id="islandSection">Under Development</span></span>
        <span class="island-name" id="islandTime">ACP Studio</span>
      </div>
      <div class="island-nav" id="islandNav">
        <a href="index.html#home">Home</a>
        <a href="index.html#projects">C++ Projects</a>
        <a href="index.html#studio">YouTube Studio</a>
        <a href="index.html#contact">Contact</a>
        <a href="login.html" id="authLink">Log in</a>
      </div>
    </nav>

    <!-- Decorative glass orbs (the card blurs them) -->
    <div class="login-orbs" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <main>
      <section class="login-card soon-card dev-card fade-in-up" aria-labelledby="devTitle">
        <div class="intro-tag">
          <span class="dev-pulse" aria-hidden="true"></span>
          Under development
        </div>

        <h1 id="devTitle">Something special is going on</h1>

        <p class="login-lead">
          ACP-Studio is being built right now. Something new is on its way, and
          it is worth the wait.
        </p>

        <!-- Interactive clock -->
        <div class="clock-block">
          <div class="clock-stage" id="clockStage">
            <button
              type="button"
              class="clock-face-btn"
              id="clockFace"
              aria-label="Clock. Press to switch between 12-hour and 24-hour time."
            >
              <svg class="clock-svg" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
                <circle class="clock-rim" cx="100" cy="100" r="96" />
                <circle class="clock-plate" cx="100" cy="100" r="90" />
                <g id="clockTicks"></g>
                <g id="clockNumbers"></g>
                <line id="handHour" class="hand hand-hour" x1="100" y1="106" x2="100" y2="58" />
                <line id="handMinute" class="hand hand-minute" x1="100" y1="108" x2="100" y2="34" />
                <g id="handSecond">
                  <line class="hand hand-second" x1="100" y1="116" x2="100" y2="26" />
                </g>
                <circle class="clock-cap" cx="100" cy="100" r="5.5" />
                <circle class="clock-cap-dot" cx="100" cy="100" r="2" />
              </svg>
            </button>
          </div>

          <div class="clock-digital" id="clockDigital" role="timer" aria-label="Current time">
            <span class="digital-time" id="digitalTime">--:--:--</span>
            <span class="digital-ampm" id="digitalAmPm" hidden></span>
          </div>
          <p class="clock-date" id="clockDate">&nbsp;</p>

          <div class="clock-controls" role="group" aria-label="Clock settings">
            <button type="button" class="clock-chip" id="zoneLocal" aria-pressed="true">Your time</button>
            <button type="button" class="clock-chip" id="zoneCairo" aria-pressed="false">Cairo</button>
            <button type="button" class="clock-chip" id="formatToggle" aria-pressed="false">24h</button>
          </div>
        </div>

        <p class="dev-quote">
          “ Building great code takes time...
          <svg class="icon" aria-hidden="true"><use href="icons.svg#time"></use></svg> ”
        </p>

        <a href="index.html#home" class="btn btn-primary login-submit">
          Back to the site
        </a>
      </section>
    </main>

    <script src="script.js"></script>
    <script src="under-development.js"></script>
  </body>
</html>
